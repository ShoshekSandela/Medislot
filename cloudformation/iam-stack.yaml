AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot IAM Stack - Lambda execution roles and required permissions

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment name

Resources:

  # 1. Lambda Authorizer
  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MediSlot API Gateway Lambda Authorizer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadJwtSigningSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/jwt/signing-secret

        - PolicyName: CheckRevokedTokens
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-auth-tokens

  # 2. Authentication Lambda
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for MediSlot authentication operations
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadJwtSigningSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/jwt/signing-secret

        - PolicyName: RefreshTokenTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-auth-tokens

        - PolicyName: ReadDatabaseCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-2c4bef40-f0a0-404e-8f88-6f4b93b4877a-*'

  # 3. Doctor Lambda execution role
  DoctorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MediSlot doctor Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadDatabaseCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-2c4bef40-f0a0-404e-8f88-6f4b93b4877a-*'

  # 4. Patient Lambda execution role
  PatientLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MediSlot patient Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  # 5. Availability Lambda execution role
  AvailabilityLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the MediSlot availability Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

Outputs:
  AuthorizerLambdaRoleArn:
    Description: ARN of the Lambda Authorizer execution role
    Value: !GetAtt AuthorizerLambdaRole.Arn

  AuthLambdaRoleArn:
    Description: ARN of the Authentication Lambda execution role
    Value: !GetAtt AuthLambdaRole.Arn

  DoctorLambdaRoleArn:
    Description: ARN of the Doctor Lambda execution role
    Value: !GetAtt DoctorLambdaRole.Arn

  PatientLambdaRoleArn:
    Description: ARN of the Patient Lambda execution role
    Value: !GetAtt PatientLambdaRole.Arn

  AvailabilityLambdaRoleArn:
    Description: ARN of the Availability Lambda execution role
    Value: !GetAtt AvailabilityLambdaRole.Arn