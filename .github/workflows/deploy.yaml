name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network
      - feature/iam-stack
    paths:
      - 'cloudformation/**'
      - 'lambdas/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NETWORK_STACK_NAME: medislot-network-dev
  DATA_STACK_NAME: medislot-data-dev
  IAM_STACK_NAME: medislot-iam-dev
  APPLICATION_STACK_NAME: medislot-application-dev

jobs:
  deploy:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Connect to AWS
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Connection
        run: aws sts get-caller-identity

      # 3. Validate Network Stack
      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      # 4. Deploy Network Stack
      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
            --no-fail-on-empty-changeset

      # 5. Retrieve Network Outputs
      - name: Get Network Resource IDs
        shell: bash
        run: |
          set -euo pipefail

          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output json)

          get_output() {
            echo "$OUTPUTS" | jq -er \
              --arg key "$1" \
              '.[] | select(.OutputKey == $key) | .OutputValue'
          }

          {
            echo "PRIVATE_SUBNET_A_ID=$(get_output PrivateSubnetAId)"
            echo "PRIVATE_SUBNET_B_ID=$(get_output PrivateSubnetBId)"
            echo "LAMBDA_SECURITY_GROUP_ID=$(get_output LambdaSecurityGroupId)"
          } >> "$GITHUB_ENV"

      # 6. Validate Data Stack
      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      # 7. Deploy Data Stack
      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              VpcId="$VPC_ID" \
              PrivateDatabaseSubnetIds="$PRIVATE_SUBNET_A_ID,$PRIVATE_SUBNET_B_ID" \
              ApplicationSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
            --no-fail-on-empty-changeset

      # 8. Validate IAM Stack
      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      # 9. Deploy IAM Stack
      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # 10. Validate Application Stack
      - name: Validate Application Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

      # 11. Deploy Application Stack
      - name: Deploy Application Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              LambdaCodeBucket="${{ vars.LAMBDA_CODE_BUCKET }}" \
              LambdaCodeKey="${{ vars.LAMBDA_CODE_KEY }}" \
              PrivateSubnetAId="$PRIVATE_SUBNET_A_ID" \
              PrivateSubnetBId="$PRIVATE_SUBNET_B_ID" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              AuthLambdaRoleArn="${{ vars.AUTH_LAMBDA_ROLE_ARN }}" \
              AuthorizerLambdaRoleArn="${{ vars.AUTHORIZER_LAMBDA_ROLE_ARN }}" \
              DoctorLambdaRoleArn="${{ vars.DOCTOR_LAMBDA_ROLE_ARN }}" \
              PatientLambdaRoleArn="${{ vars.PATIENT_LAMBDA_ROLE_ARN }}" \
              DatabaseSecretArn="${{ vars.DATABASE_SECRET_ARN }}" \
              DatabaseHost="${{ vars.DATABASE_HOST }}" \
              DatabaseName=medislot \
              AuthTokensTableName="${{ vars.AUTH_TOKENS_TABLE_NAME }}" \
              JwtSecretParameter="${{ vars.JWT_SECRET_PARAMETER }}" \
            --no-fail-on-empty-changeset

      # 12. Display Deployment Status
      - name: Display Deployment Status
        if: always()
        shell: bash
        run: |
          for STACK in \
            "$NETWORK_STACK_NAME" \
            "$DATA_STACK_NAME" \
            "$IAM_STACK_NAME" \
            "$APPLICATION_STACK_NAME"
          do
            echo "======================================"
            echo "Stack: $STACK"

            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].[StackName,StackStatus]' \
              --output table || true
          done