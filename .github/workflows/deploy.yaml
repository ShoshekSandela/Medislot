name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy.yaml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NETWORK_STACK_NAME: medislot-network-dev
  DATA_STACK_NAME: medislot-data-dev

jobs:
  deploy:
    name: Validate and Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Connection
        run: aws sts get-caller-identity

      # Deploy the Network Stack first.
      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
            --no-fail-on-empty-changeset

      # Read the outputs from the Network Stack for the Data Stack.
      - name: Get Network Resource IDs
        shell: bash
        run: |
          set -euo pipefail

          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output json)

          echo "$OUTPUTS"

          get_output() {
            echo "$OUTPUTS" | jq -er --arg key "$1" \
              '.[] | select(.OutputKey == $key) | .OutputValue'
          }

          VPC_ID=$(get_output VpcId)
          PRIVATE_DB_SUBNET_A_ID=$(get_output PrivateDBSubnetAId)
          PRIVATE_DB_SUBNET_B_ID=$(get_output PrivateDBSubnetBId)
          LAMBDA_SECURITY_GROUP_ID=$(get_output LambdaSecurityGroupId)

          {
            echo "VPC_ID=$VPC_ID"
            echo "PRIVATE_DB_SUBNET_A_ID=$PRIVATE_DB_SUBNET_A_ID"
            echo "PRIVATE_DB_SUBNET_B_ID=$PRIVATE_DB_SUBNET_B_ID"
            echo "LAMBDA_SECURITY_GROUP_ID=$LAMBDA_SECURITY_GROUP_ID"
          } >> "$GITHUB_ENV"

      # Deploy the Data Stack only after the Network Stack succeeds.
      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              VpcId="$VPC_ID" \
              PrivateDatabaseSubnetIds="$PRIVATE_DB_SUBNET_A_ID,$PRIVATE_DB_SUBNET_B_ID" \
              ApplicationSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
            --no-fail-on-empty-changeset

      - name: Display Stack Status
        if: always()
        run: |
          echo "Network Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table || true

          echo "Data Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table || true
