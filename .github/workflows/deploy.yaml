name: MediSlot Network Stack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate and Deploy Network Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check AWS Connection
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region us-east-1

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name medislot-network-dev \
            --region us-east-1 \
            --parameter-overrides Environment=dev \
            --no-fail-on-empty-changeset