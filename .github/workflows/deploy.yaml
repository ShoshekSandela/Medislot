name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Validate and Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Connect to AWS using OIDC
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Step 3: Verify AWS connection
      - name: Check AWS Connection
        run: aws sts get-caller-identity

      # Step 4: Validate Network Stack
      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region us-east-1

      # Step 5: Deploy Network Stack
      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name medislot-network-dev \
            --region us-east-1 \
            --parameter-overrides Environment=dev \
            --no-fail-on-empty-changeset

      # Step 6: Get Network Stack Outputs
      - name: Get Network Resource IDs
        shell: bash
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name medislot-network-dev \
            --region us-east-1 \
            --query "Stacks[0].Outputs" \
            --output json)

          echo "$OUTPUTS"

          VPC_ID=$(echo "$OUTPUTS" | jq -r \
            '.[] | select(.OutputKey=="VpcId") | .OutputValue')

          PRIVATE_DB_SUBNET_A_ID=$(echo "$OUTPUTS" | jq -r \
            '.[] | select(.OutputKey=="PrivateDBSubnetAId") | .OutputValue')

          PRIVATE_DB_SUBNET_B_ID=$(echo "$OUTPUTS" | jq -r \
            '.[] | select(.OutputKey=="PrivateDBSubnetBId") | .OutputValue')

          LAMBDA_SECURITY_GROUP_ID=$(echo "$OUTPUTS" | jq -r \
            '.[] | select(.OutputKey=="LambdaSecurityGroupId") | .OutputValue')

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "null" ]; then
            echo "ERROR: VpcId output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_DB_SUBNET_A_ID" ] || [ "$PRIVATE_DB_SUBNET_A_ID" = "null" ]; then
            echo "ERROR: PrivateDBSubnetAId output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_DB_SUBNET_B_ID" ] || [ "$PRIVATE_DB_SUBNET_B_ID" = "null" ]; then
            echo "ERROR: PrivateDBSubnetBId output is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP_ID" ] || [ "$LAMBDA_SECURITY_GROUP_ID" = "null" ]; then
            echo "ERROR: LambdaSecurityGroupId output is missing."
            exit 1
          fi

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "PRIVATE_DB_SUBNET_A_ID=$PRIVATE_DB_SUBNET_A_ID" >> "$GITHUB_ENV"
          echo "PRIVATE_DB_SUBNET_B_ID=$PRIVATE_DB_SUBNET_B_ID" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=$LAMBDA_SECURITY_GROUP_ID" >> "$GITHUB_ENV"

      # Step 7: Validate Data Stack
      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region us-east-1

      # Step 8: Deploy Data Stack
      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name medislot-data-dev \
            --region us-east-1 \
            --parameter-overrides \
              Environment=dev \
              VpcId="$VPC_ID" \
              PrivateDatabaseSubnetIds="$PRIVATE_DB_SUBNET_A_ID,$PRIVATE_DB_SUBNET_B_ID" \
              ApplicationSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID"