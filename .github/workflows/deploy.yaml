name: MediSlot Infrastructure Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - network
      - feature/iam-stack
    paths:
      - 'cloudformation/**'
      - 'lambdas/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NETWORK_STACK_NAME: medislot-network-dev
  DATA_STACK_NAME: medislot-data-dev
  IAM_STACK_NAME: medislot-iam-dev
  APPLICATION_STACK_NAME: medislot-application-dev

jobs:
  deploy:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Connection
        run: aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
            --no-fail-on-empty-changeset

      - name: Get Network Resource IDs
        shell: bash
        run: |
          set -euo pipefail

          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output json)

          get_output() {
            echo "$OUTPUTS" | jq -er --arg key "$1" \
              '.[] | select(.OutputKey == $key) | .OutputValue'
          }

          VPC_ID=$(get_output VpcId)
          PRIVATE_SUBNET_A_ID=$(get_output PrivateSubnetAId)
          PRIVATE_SUBNET_B_ID=$(get_output PrivateSubnetBId)
          LAMBDA_SECURITY_GROUP_ID=$(get_output LambdaSecurityGroupId)

          {
            echo "VPC_ID=$VPC_ID"
            echo "PRIVATE_SUBNET_A_ID=$PRIVATE_SUBNET_A_ID"
            echo "PRIVATE_SUBNET_B_ID=$PRIVATE_SUBNET_B_ID"
            echo "LAMBDA_SECURITY_GROUP_ID=$LAMBDA_SECURITY_GROUP_ID"
          } >> "$GITHUB_ENV"

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Data Stack Parameters
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS=$(aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION" \
            --query 'Parameters[].ParameterKey' \
            --output text)

          echo "Parameters detected in data-stack.yaml:"
          printf '%s\n' "$PARAMETERS"

          for PARAM in Environment VpcId PrivateDatabaseSubnetIds ApplicationSecurityGroupId; do
            if ! printf '%s\n' "$PARAMETERS" | tr '\t' '\n' | grep -Fxq "$PARAM"; then
              echo "ERROR: $PARAM is missing from cloudformation/data-stack.yaml"
              exit 1
            fi
          done

          echo "All required Data Stack parameters are present."

      - name: Deploy Data Stack
        shell: bash
        run: |
          set -euo pipefail

          test -n "$VPC_ID"
          test -n "$PRIVATE_SUBNET_A_ID"
          test -n "$PRIVATE_SUBNET_B_ID"
          test -n "$LAMBDA_SECURITY_GROUP_ID"

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              VpcId="$VPC_ID" \
              PrivateDatabaseSubnetIds="$PRIVATE_SUBNET_A_ID,$PRIVATE_SUBNET_B_ID" \
              ApplicationSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
            --no-fail-on-empty-changeset

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Validate Application Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

      
      - name: Deploy Application Stack
        shell: bash
        run: |
          set -euo pipefail

          DATA=$(aws cloudformation describe-stacks --stack-name "$DATA_STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].Outputs' --output json)
          IAM=$(aws cloudformation describe-stacks --stack-name "$IAM_STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].Outputs' --output json)

          output() { printf '%s' "$1" | jq -er --arg key "$2" '.[] | select(.OutputKey == $key) | .OutputValue'; }

          BUCKET=$(output "$DATA" ApplicationFilesBucketName)
          DB_HOST=$(output "$DATA" DatabaseEndpoint)
          DB_SECRET=$(output "$DATA" DatabaseSecretArn)
          TOKENS=$(output "$DATA" AuthTokensTableName)

          zip -qr "$RUNNER_TEMP/medislot-lambdas.zip" lambdas/
          aws s3 cp "$RUNNER_TEMP/medislot-lambdas.zip" "s3://$BUCKET/medislot-lambdas.zip"

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment=dev \
              LambdaCodeBucket="$BUCKET" LambdaCodeKey=medislot-lambdas.zip \
              PrivateSubnetAId="$PRIVATE_SUBNET_A_ID" PrivateSubnetBId="$PRIVATE_SUBNET_B_ID" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              AuthLambdaRoleArn="$(output "$IAM" AuthLambdaRoleArn)" \
              AuthorizerLambdaRoleArn="$(output "$IAM" AuthorizerLambdaRoleArn)" \
              DoctorLambdaRoleArn="$(output "$IAM" DoctorLambdaRoleArn)" \
              PatientLambdaRoleArn="$(output "$IAM" PatientLambdaRoleArn)" \
              DatabaseSecretArn="$DB_SECRET" DatabaseHost="$DB_HOST" \
              DatabaseName=medislot AuthTokensTableName="$TOKENS" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Display Deployment Status
        if: always()
        shell: bash
        run: |
          for STACK in \
            "$NETWORK_STACK_NAME" \
            "$DATA_STACK_NAME" \
            "$IAM_STACK_NAME" \
            "$APPLICATION_STACK_NAME"
          do
            echo "======================================"
            echo "Stack: $STACK"
            aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].[StackName,StackStatus]' \
              --output table || true
          done
