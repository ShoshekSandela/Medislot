{% extends 'base.html' %}
{% block body %}
<main class="auth-shell">
  <section class="auth-card">
    <div class="auth-aside">
      <span class="eyebrow">MEDISLOT FOR PATIENTS</span>
      <h1>Find the right care.</h1>
      <p>Sign in to manage your profile, discover doctors and browse available slots.</p>
    </div>
    <div class="auth-form">
      <a class="back-link" href="{{ url_for('landing.index') }}">← Home</a>
      <h2>Patient sign in</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email address
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Password
          <div class="password-wrap">
            <input id="patient-password" type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="show-password" data-toggle-password="patient-password" aria-controls="patient-password" aria-label="Show password">Show</button>
          </div>
        </label>
        <button class="btn primary full" type="submit">Sign in →</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
