{% extends 'base.html' %}
{% block body %}<main class="auth-shell"><section class="auth-card"><div class="auth-aside"><span class="eyebrow">JOIN MEDISLOT</span><h1>Your care, in one place.</h1><p>Create your patient account to find doctors and explore availability.</p></div><div class="auth-form"><a class="back-link" href="{{ url_for('patient.login') }}">← Patient login</a><h2>Create patient account</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field-row"><label>First name<input name="first_name" maxlength="100" required></label><label>Last name<input name="last_name" maxlength="100"></label></div><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone" maxlength="20"></label><label>Date of birth<input type="date" name="date_of_birth"></label><label>Gender<select name="gender"><option value="">Prefer not to say</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select></label><label>Password<input type="password" name="password" minlength="12" maxlength="72" required></label><button class="btn primary full" type="submit">Create account →</button></form></div></section></main>{% endblock %}
