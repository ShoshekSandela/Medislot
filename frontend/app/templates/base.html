<!doctype html><html lang="en" data-theme=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>{{ title or 'MediSlot' }} · MediSlot</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ static_base }}/css/app.css"></head><body>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="toasts" role="status" aria-live="polite">{% for category,message in messages %}<div class="toast {{ category }}">{{ message }}<button type="button" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button></div>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}<script src="{{ static_base }}/js/app.js" defer></script></body></html>
